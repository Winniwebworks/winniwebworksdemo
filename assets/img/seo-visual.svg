<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="seoTitle">
  <title id="seoTitle">Illustration of a search results page with one business highlighted at the top, beside a chart of rising search clicks</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf1f4"/>
      <stop offset="100%" stop-color="#bfe6ec"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fc4d6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2fc4d6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#bgGrad)"/>

  <!-- faint ripple rings, ties back to the lake motif -->
  <g fill="none" stroke="#1c9db3" stroke-width="1.5" opacity="0.35">
    <circle cx="120" cy="540" r="40"/>
    <circle cx="120" cy="540" r="70"/>
    <circle cx="120" cy="540" r="100"/>
  </g>
  <g fill="none" stroke="#1c9db3" stroke-width="1.5" opacity="0.25">
    <circle cx="700" cy="90" r="30"/>
    <circle cx="700" cy="90" r="54"/>
  </g>

  <!-- search results window -->
  <g>
    <rect x="90" y="80" width="470" height="430" rx="22" fill="#0a1930" opacity="0.12" transform="translate(8,12)"/>
    <rect x="90" y="80" width="470" height="430" rx="22" fill="#ffffff"/>

    <!-- search bar -->
    <rect x="122" y="112" width="406" height="54" rx="27" fill="#eef6f7" stroke="#a9dde6" stroke-width="2"/>
    <g fill="none" stroke="#1c9db3" stroke-width="5" stroke-linecap="round">
      <circle cx="156" cy="137" r="10"/>
      <path d="M164 145 L172 153"/>
    </g>
    <rect x="190" y="131" width="190" height="12" rx="6" fill="#4c6474" opacity="0.55"/>

    <!-- top result, highlighted -->
    <rect x="122" y="192" width="406" height="100" rx="14" fill="#dcf1f4" stroke="#1c9db3" stroke-width="2.5"/>
    <circle cx="156" cy="226" r="14" fill="#1c9db3"/>
    <path d="M149 226 L154 231 L163 221" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="182" y="216" width="220" height="14" rx="7" fill="#0b1f33"/>
    <rect x="182" y="244" width="310" height="9" rx="4.5" fill="#4c6474" opacity="0.5"/>
    <rect x="182" y="262" width="250" height="9" rx="4.5" fill="#4c6474" opacity="0.5"/>

    <!-- other results -->
    <g opacity="0.55">
      <circle cx="156" cy="336" r="12" fill="#d6e5e9"/>
      <rect x="182" y="326" width="180" height="12" rx="6" fill="#4c6474"/>
      <rect x="182" y="350" width="300" height="8" rx="4" fill="#d6e5e9"/>
      <rect x="182" y="366" width="240" height="8" rx="4" fill="#d6e5e9"/>
    </g>
    <g opacity="0.4">
      <circle cx="156" cy="424" r="12" fill="#d6e5e9"/>
      <rect x="182" y="414" width="200" height="12" rx="6" fill="#4c6474"/>
      <rect x="182" y="438" width="280" height="8" rx="4" fill="#d6e5e9"/>
      <rect x="182" y="454" width="220" height="8" rx="4" fill="#d6e5e9"/>
    </g>
  </g>

  <!-- rising clicks chart card -->
  <g>
    <rect x="430" y="330" width="290" height="230" rx="20" fill="#0a1930" opacity="0.14" transform="translate(8,12)"/>
    <rect x="430" y="330" width="290" height="230" rx="20" fill="#0f2542"/>
    <rect x="456" y="356" width="96" height="10" rx="5" fill="#5fdcee"/>
    <rect x="456" y="376" width="60" height="8" rx="4" fill="#ffffff" opacity="0.35"/>

    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <path d="M456 430 H694"/>
      <path d="M456 475 H694"/>
      <path d="M456 520 H694"/>
    </g>

    <path d="M456 512 L503 502 L550 506 L597 468 L644 446 L694 404 L694 530 L456 530 Z" fill="url(#chartGrad)"/>
    <path d="M456 512 L503 502 L550 506 L597 468 L644 446 L694 404" fill="none" stroke="#2fc4d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#2fc4d6" stroke-width="4">
      <circle cx="550" cy="506" r="6"/>
      <circle cx="694" cy="404" r="7"/>
    </g>
  </g>

  <!-- floating location pin (top right) -->
  <g transform="translate(640,210)">
    <circle cx="0" cy="0" r="46" fill="#ffffff"/>
    <path d="M0 26 C-16 6 -20 -2 -20 -10 A20 20 0 1 1 20 -10 C20 -2 16 6 0 26 Z" fill="#1c9db3"/>
    <circle cx="0" cy="-10" r="8" fill="#ffffff"/>
  </g>
</svg>
